name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build exe
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # required to attach the exe to a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build standalone exe
        run: python -m PyInstaller "SAF Explorer.spec" --noconfirm
      - name: Sanity-check the exe
        shell: pwsh
        run: |
          $exe = "dist/SAF Explorer.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          $file = Get-Item $exe
          if ($file.Length -lt 5MB) { throw "Unexpectedly small exe: $($file.Length) bytes" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a Windows executable" }
          "SAF Explorer.exe is {0:N0} bytes" -f $file.Length
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SAF-Explorer-windows
          path: dist/SAF Explorer.exe
          if-no-files-found: error
      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SAF Explorer.exe
          generate_release_notes: true
